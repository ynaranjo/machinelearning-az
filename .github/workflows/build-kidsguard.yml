name: Build KidsGuard APK

on:
  push:
    branches:
      - claude/android-parental-control-wit63o
      - main
    paths:
      - 'kidsguard-android/**'
      - '.github/workflows/build-kidsguard.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'kidsguard-android/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Cache Gradle wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-wrapper-

      - name: Make gradlew executable
        run: chmod +x kidsguard-android/gradlew

      - name: Build Debug APK
        run: |
          cd kidsguard-android
          ./gradlew clean assembleDebug --stacktrace

      - name: Build Release APK
        run: |
          cd kidsguard-android
          ./gradlew assembleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kidsguard-debug
          path: kidsguard-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kidsguard-release
          path: kidsguard-android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            kidsguard-android/app/build/outputs/apk/release/app-release-unsigned.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
