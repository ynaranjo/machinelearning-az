name: Build KidsGuard APK

on:
  push:
    branches:
      - claude/android-parental-control-wit63o
      - main
    tags:
      - 'v*'
    paths:
      - 'kidsguard-android/**'
      - '.github/workflows/build-kidsguard.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'kidsguard-android/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Definir estos secrets en Settings -> Secrets and variables -> Actions
      # para obtener un APK de release firmado (ver README del proyecto):
      #   KIDSGUARD_KEYSTORE_BASE64, KIDSGUARD_KEYSTORE_PASSWORD,
      #   KIDSGUARD_KEY_ALIAS, KIDSGUARD_KEY_PASSWORD
      KEYSTORE_BASE64: ${{ secrets.KIDSGUARD_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # El proyecto no incluye el wrapper de Gradle: se instala aquí.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Run unit tests
        working-directory: kidsguard-android
        run: gradle testDebugUnitTest --stacktrace

      - name: Build Debug APK
        working-directory: kidsguard-android
        run: gradle assembleDebug --stacktrace

      - name: Decode release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kidsguard.keystore"

      - name: Build Release APK
        working-directory: kidsguard-android
        env:
          KIDSGUARD_KEYSTORE_PASSWORD: ${{ secrets.KIDSGUARD_KEYSTORE_PASSWORD }}
          KIDSGUARD_KEY_ALIAS: ${{ secrets.KIDSGUARD_KEY_ALIAS }}
          KIDSGUARD_KEY_PASSWORD: ${{ secrets.KIDSGUARD_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            export KIDSGUARD_KEYSTORE_FILE="$RUNNER_TEMP/kidsguard.keystore"
            echo "Compilando release FIRMADO"
          else
            echo "Sin keystore configurado: release sin firmar"
          fi
          gradle assembleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kidsguard-debug
          path: kidsguard-android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: kidsguard-release
          path: kidsguard-android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: kidsguard-android/app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
